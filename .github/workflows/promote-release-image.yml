name: Promote Released Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing latest stable GitHub release to promote as the Docker latest tag.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the existing release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$latest_release" != "$VERSION" ]; then
            echo "Only the current latest stable release can be promoted."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "${image}:${VERSION}"
          docker buildx imagetools create --tag "${image}:latest" "${image}:${VERSION}"
